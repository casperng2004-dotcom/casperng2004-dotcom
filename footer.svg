<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90">
  <defs>
    <pattern id="hz" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#1e6fe0"/>
      <rect x="20" width="20" height="40" fill="#030a18"/>
    </pattern>
    <style>
      .blink { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="90" fill="#030a18"/>
  <rect x="0" y="0" width="1200" height="14" fill="url(#hz)"/>
  <rect x="0" y="14" width="1200" height="2" fill="#4fb3ff"/>
  <text x="600" y="58" text-anchor="middle" font-family="'Times New Roman','Liberation Serif',serif" font-weight="900" font-size="26" fill="#e8f2ff" letter-spacing="4">END OF TRANSMISSION</text>
  <text x="600" y="80" text-anchor="middle" font-family="'Courier New','Liberation Mono',monospace" font-size="13" fill="#4f7fbf" letter-spacing="3">通信終了 — CHANNEL STANDING BY <tspan class="blink" fill="#4fb3ff">█</tspan></text>
</svg>
