<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <pattern id="hex" width="28" height="48.5" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M14 0 L28 8.08 L28 24.25 L14 32.33 L0 24.25 L0 8.08 Z M14 32.33 L14 48.5" fill="none" stroke="#0f2a55" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.25"/>
    </pattern>
    <pattern id="hazard" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#1e6fe0"/>
      <rect x="20" width="20" height="40" fill="#030a18"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#030a18" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#030a18" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#030a18" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="digits"><rect x="780" y="116" width="340" height="78"/></clipPath>
    <style>
      .serif { font-family: 'Times New Roman', 'Liberation Serif', Georgia, serif; font-weight: 900; }
      .mono  { font-family: 'Courier New', 'Liberation Mono', monospace; font-weight: 700; }
      .sans  { font-family: 'Arial Narrow', 'Liberation Sans Narrow', Arial, sans-serif; font-weight: 700; }
      .dg    { fill: #4fb3ff; font-size: 72px; }
      .s5  { animation: k5  300s steps(5)  infinite; }
      .s6  { animation: k6   60s steps(6)  infinite; }
      .s10a{ animation: k10  10s steps(10) infinite; }
      .s10b{ animation: k10   1s steps(10) infinite; }
      .s10c{ animation: k10 0.1s steps(10) infinite; }
      @keyframes k5  { to { transform: translateY(-400px); } }
      @keyframes k6  { to { transform: translateY(-480px); } }
      @keyframes k10 { to { transform: translateY(-800px); } }
      .blink { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.15; } }
      .sweep { animation: sweep 4s linear infinite; }
      @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(340px); } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="#030a18"/>
  <rect width="1200" height="320" fill="url(#hex)"/>
  <rect width="1200" height="320" fill="url(#fade)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="26" fill="#071631"/>
  <text x="24" y="18" class="mono" font-size="13" fill="#4fb3ff" letter-spacing="2">PERSONAL TERMINAL // 個人端末 — LINK ESTABLISHED</text>
  <text x="1176" y="18" class="mono" font-size="13" fill="#4fb3ff" text-anchor="end" letter-spacing="2">SECTOR 03 · <tspan class="blink">● REC</tspan></text>

  <!-- title block -->
  <text x="40" y="78" class="sans" font-size="16" fill="#7fc6ff" letter-spacing="6">HOBBY ACCOUNT · 趣味</text>
  <text x="36" y="168" class="serif" font-size="104" fill="#e8f2ff" letter-spacing="-2" filter="url(#glow)">YHCHAN</text>
  <rect x="40" y="186" width="420" height="4" fill="#1e6fe0"/>
  <text x="40" y="218" class="serif" font-size="26" fill="#9fd0ff">3D Artist · Game Dev Hobbyist</text>
  <text x="40" y="246" class="mono" font-size="14" fill="#4f7fbf" letter-spacing="1">BLENDER // ANIMATION // PHYSICS FX // INDIE GAMES</text>

  <!-- countdown panel -->
  <g>
    <rect x="760" y="50" width="400" height="214" fill="#041026" stroke="#1e6fe0" stroke-width="2"/>
    <rect x="760" y="50" width="400" height="30" fill="#1e6fe0"/>
    <text x="774" y="71" class="sans" font-size="17" fill="#030a18" letter-spacing="3">SYSTEM COOLDOWN</text>
    <text x="1146" y="71" class="serif" font-size="17" fill="#030a18" text-anchor="end">冷却中</text>

    <!-- digits -->
    <g clip-path="url(#digits)" class="mono dg" filter="url(#glow)">
      <g class="s5">
        <text x="784" y="180">4</text><text x="784" y="260">3</text><text x="784" y="340">2</text><text x="784" y="420">1</text><text x="784" y="500">0</text>
      </g>
      <text x="826" y="176">:</text>
      <g class="s6">
        <text x="868" y="180">5</text><text x="868" y="260">4</text><text x="868" y="340">3</text><text x="868" y="420">2</text><text x="868" y="500">1</text><text x="868" y="580">0</text>
      </g>
      <g class="s10a">
        <text x="912" y="180">9</text><text x="912" y="260">8</text><text x="912" y="340">7</text><text x="912" y="420">6</text><text x="912" y="500">5</text><text x="912" y="580">4</text><text x="912" y="660">3</text><text x="912" y="740">2</text><text x="912" y="820">1</text><text x="912" y="900">0</text>
      </g>
      <text x="954" y="176">:</text>
      <g class="s10b">
        <text x="996" y="180">9</text><text x="996" y="260">8</text><text x="996" y="340">7</text><text x="996" y="420">6</text><text x="996" y="500">5</text><text x="996" y="580">4</text><text x="996" y="660">3</text><text x="996" y="740">2</text><text x="996" y="820">1</text><text x="996" y="900">0</text>
      </g>
      <g class="s10c">
        <text x="1040" y="180">9</text><text x="1040" y="260">8</text><text x="1040" y="340">7</text><text x="1040" y="420">6</text><text x="1040" y="500">5</text><text x="1040" y="580">4</text><text x="1040" y="660">3</text><text x="1040" y="740">2</text><text x="1040" y="820">1</text><text x="1040" y="900">0</text>
      </g>
    </g>
    <text x="1092" y="104" class="mono" font-size="11" fill="#4f7fbf">MIN:SEC:CS</text>

    <!-- mode indicators -->
    <g class="sans" font-size="14" letter-spacing="2">
      <rect x="780" y="210" width="110" height="34" fill="none" stroke="#1e4a8a"/>
      <text x="835" y="232" text-anchor="middle" fill="#1e4a8a">STANDBY</text>
      <rect x="905" y="210" width="110" height="34" fill="#4fb3ff" class="blink"/>
      <text x="960" y="232" text-anchor="middle" fill="#030a18">COOLING</text>
      <rect x="1030" y="210" width="110" height="34" fill="none" stroke="#1e4a8a"/>
      <text x="1085" y="232" text-anchor="middle" fill="#1e4a8a">OVERLOAD</text>
    </g>
  </g>

  <!-- hazard band -->
  <rect x="0" y="290" width="1200" height="30" fill="url(#hazard)"/>
  <rect x="0" y="288" width="1200" height="2" fill="#4fb3ff"/>

  <!-- scanlines + sweep -->
  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="1200" height="30" fill="#4fb3ff" opacity="0.05"/>
</svg>
