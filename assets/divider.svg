<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <pattern id="hz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#1e6fe0"/>
    </pattern>
    <style>
      .run { animation: run 3s linear infinite; }
      @keyframes run { from { transform: translateX(-120px); } to { transform: translateX(1200px); } }
    </style>
  </defs>
  <rect x="0" y="4" width="120" height="16" fill="url(#hz)"/>
  <rect x="1080" y="4" width="120" height="16" fill="url(#hz)"/>
  <rect x="130" y="11" width="940" height="2" fill="#1e4a8a"/>
  <rect class="run" x="0" y="10" width="120" height="4" fill="#4fb3ff"/>
</svg>
