<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <defs>
    <pattern id="hex" width="20" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M10 0 L20 5.77 L20 17.32 L10 23.09 L0 17.32 L0 5.77 Z M10 23.09 L10 34.64" fill="none" stroke="#0f2a55" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.3"/>
    </pattern>
    <style>
      .blink { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.1; } }
      .sweep { animation: sweep 2.5s linear infinite; }
      @keyframes sweep { from { transform: translateY(-20px); } to { transform: translateY(240px); } }
    </style>
  </defs>
  <rect width="400" height="225" fill="#030a18"/>
  <rect width="400" height="225" fill="url(#hex)"/>
  <!-- corner brackets -->
  <g stroke="#4fb3ff" stroke-width="3" fill="none">
    <path d="M12 40 V12 H40"/><path d="M360 12 H388 V40"/>
    <path d="M388 185 V213 H360"/><path d="M40 213 H12 V185"/>
  </g>
  <text x="200" y="104" text-anchor="middle" font-family="'Times New Roman','Liberation Serif',serif" font-weight="900" font-size="30" fill="#e8f2ff" letter-spacing="3">NO SIGNAL</text>
  <text x="200" y="130" text-anchor="middle" font-family="'Courier New','Liberation Mono',monospace" font-weight="700" font-size="13" fill="#4fb3ff" letter-spacing="2">GIF SLOT · 映像待機</text>
  <rect x="150" y="146" width="100" height="22" fill="#1e6fe0" class="blink"/>
  <text x="200" y="162" text-anchor="middle" font-family="'Arial Narrow','Liberation Sans Narrow',Arial,sans-serif" font-weight="700" font-size="13" fill="#030a18" letter-spacing="2">AWAITING</text>
  <text x="24" y="34" font-family="'Courier New','Liberation Mono',monospace" font-size="11" fill="#4f7fbf"><tspan class="blink" fill="#4fb3ff">●</tspan> FEED</text>
  <rect width="400" height="225" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="400" height="16" fill="#4fb3ff" opacity="0.07"/>
</svg>
